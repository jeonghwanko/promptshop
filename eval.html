<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>promptshop — eval</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  :root { --ground:#e8dcc4; --ink:#2e241a; --dim:#7a6a55; --card:#f3ead8; --line:#d4c4a6; --accent:#3f7a74; --good:#2f8f5b; --bad:#c0392b;
          --f-disp:"Jua","Noto Sans KR",sans-serif; --f-ui:"Noto Sans KR",system-ui,sans-serif; }
  body { margin:0; background:var(--ground); color:var(--ink); font:14px/1.5 var(--f-ui); padding:20px max(16px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width:1300px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0; font:400 28px/1.2 var(--f-disp); }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, select { font:700 14px var(--f-ui); padding:9px 14px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  select { background:var(--card); color:var(--ink); font-weight:400; }
  button.ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible, select:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; }
  .stat { background:var(--card); border-radius:12px; padding:10px 14px; }
  .stat .k { font-size:12px; color:var(--dim); } .stat .v { font:400 26px var(--f-disp); font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:12px; }
  .item { background:var(--card); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .item .line { font-weight:700; }
  .item .meta { font-size:12px; color:var(--dim); }
  .pics { display:flex; gap:6px; align-items:flex-end; overflow:hidden; }
  .pics canvas { image-rendering:pixelated; max-width:48%; height:auto; }
  .issues { font-size:12px; } .issues .f { color:var(--dim); } .issues .a { color:var(--bad); }
  .judge { display:flex; gap:6px; } .judge button { padding:5px 10px; font-size:13px; }
  .judge button.on.yes { background:var(--good); } .judge button.on.no { background:var(--bad); }
  .judge button:not(.on) { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  .note { color:var(--dim); font-size:13px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<div class="wrap">
  <h1>건물 생성 평가</h1>
  <p class="note">평가용 한 줄 설명을 차례로 Claude에게 보내 짓고, 자동 수선과 다시 묻기를 거친 결과를 잽니다. 그림을 보고 "원한 건물"인지 표시해 주세요. 결과는 이 페이지의 저장소에 남습니다. 누르는 사람의 Claude 사용량을 씁니다.</p>
  <div class="bar">
    <select id="count" aria-label="몇 줄을 돌릴지"><option value="10">10줄</option><option value="30">30줄</option><option value="60" selected>60줄 전부</option></select>
    <select id="revise" aria-label="다시 묻기"><option value="1" selected>다시 묻기 켬</option><option value="0">다시 묻기 끔</option></select>
    <button id="go">평가 돌리기</button><button id="stop" class="ghost" hidden>멈추기</button>
    <span class="note" id="status"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
</div>
<script type="module">
import { lineReader } from './src/steps.js';
import { emptyBuilding, applyStep, buildPrompt } from './src/v2/steps.js';
import { check, missingParts, revisePrompt } from './src/v2/check.js';
import { normalize } from './src/v2/spec.js';
import { renderView } from './src/v2/render.js';
import { TYPE_KO, TYPES } from './src/v2/catalog.js';
import { EVAL } from './examples/eval.js';

const $ = (id) => document.getElementById(id);
const sample = (await window.claude?.use?.('sample')?.catch?.(() => null)) ?? null;
const db = (await window.claude?.use?.('db')?.catch?.(() => null)) ?? null;
let results = [], stopReq = false, runId = null;

function stats() {
  const n = results.length, ok = results.filter(r => r.built).length, judged = results.filter(r => r.ok != null), yes = judged.filter(r => r.ok).length;
  const fixed = results.reduce((a, r) => a + r.fixed.length, 0), asked = results.filter(r => r.asked).length, left = results.filter(r => r.left.length).length;
  // variety: different looks per family (type, roof, front, hero)
  const fam = {}; for (const r of results.filter(r => r.built)) { (fam[r.family] ??= new Set()).add(r.sig); }
  const famN = Object.values(fam), variety = famN.length ? famN.reduce((a, s) => a + s.size, 0) / results.filter(r => r.built).length : 0;
  const types = new Set(results.filter(r => r.built).map(r => r.type)).size;
  const cards = [['지은 줄', `${n}`], ['오류 없이 지어짐', n ? `${Math.round(ok / n * 100)}%` : '–'], ['자동 수선', `${fixed}건`], ['다시 물음', `${asked}회`],
    ['끝까지 남은 문제', `${left}줄`], ['쓰인 종류', `${types}가지`], ['같은 계열 안 다양성', n ? `${Math.round(variety * 100)}%` : '–'], ['원한 건물', judged.length ? `${yes}/${judged.length}` : '표시 전']];
  $('stats').replaceChildren(...cards.map(([k, v]) => { const d = document.createElement('div'); d.className = 'stat'; d.innerHTML = '<div class="k"></div><div class="v"></div>'; d.children[0].textContent = k; d.children[1].textContent = v; return d; }));
}
async function save(r) {
  if (!db || !runId) return;
  try { await db.doc(`runs/${runId}/items/i${String(r.i).padStart(2, '0')}`).set({ i: r.i, line: r.line, built: r.built, type: r.type ?? null, style: r.style ?? null, levels: r.levels ?? null,
    family: r.family ?? null, sig: r.sig ?? null, fixed: r.fixed, left: r.left, asked: r.asked, ok: r.ok ?? null, raw: r.raw.slice(0, 8000), ms: r.ms }); } catch { /* offline or no access: the page still works */ }
}
function card(r) {
  const el = document.createElement('div'); el.className = 'item';
  const line = document.createElement('div'); line.className = 'line'; line.textContent = `${r.i + 1}. ${r.line}`;
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.textContent = r.built ? `${TYPE_KO[r.type] ?? r.type} · ${r.style} · ${r.levels}층 · ${(r.ms / 1000).toFixed(1)}초` : '짓지 못함';
  const pics = document.createElement('div'); pics.className = 'pics';
  if (r.built) { try { const a = renderView(r.input, 'ext').canvas, b = renderView(r.input, 'section').canvas; pics.append(a, b); } catch (e) { pics.textContent = '그리기 실패: ' + e.message; } }
  const iss = document.createElement('div'); iss.className = 'issues';
  for (const f of r.fixed) { const s = document.createElement('div'); s.className = 'f'; s.textContent = '수선 · ' + f; iss.append(s); }
  for (const a of r.left) { const s = document.createElement('div'); s.className = 'a'; s.textContent = '남음 · ' + a; iss.append(s); }
  const judge = document.createElement('div'); judge.className = 'judge';
  const yes = document.createElement('button'); yes.textContent = '원한 건물'; yes.className = 'yes';
  const no = document.createElement('button'); no.textContent = '아님'; no.className = 'no';
  const paint = () => { yes.classList.toggle('on', r.ok === true); no.classList.toggle('on', r.ok === false); };
  yes.onclick = () => { r.ok = r.ok === true ? null : true; paint(); stats(); save(r); };
  no.onclick = () => { r.ok = r.ok === false ? null : false; paint(); stats(); save(r); };
  paint(); judge.append(yes, no);
  el.append(line, meta, pics, iss, judge); return el;
}

async function one(i, line, revise) {
  const t0 = performance.now(), b = emptyBuilding(), seen = []; let broken = 0, raw = '';
  const apply = (s) => { if (s.step === 'floor' && s.replace && b.input) b.input.floors = []; if (applyStep(b, s)) seen.push(s); };
  const r = { i, line, built: false, fixed: [], left: [], asked: false, raw: '' };
  try {
    const rd = lineReader(apply, () => broken++);
    await sample(buildPrompt(line), { modelTier: 'quick', cache: false, onText: ({ delta }) => { raw += delta; rd.push(delta); } }); rd.end();
    let c = check(b.input, { broken, line }); r.fixed.push(...c.fixed);
    const miss = missingParts(seen).filter(p => p === 'building').map(p => `The "${p}" line is missing.`);
    let problems = [...c.ask, ...miss];
    if (problems.length && revise) {
      r.asked = true; let first = true;
      const rd2 = lineReader((s) => { if (s.step === 'floor' && first) { s.replace = true; first = false; } apply(s); });
      await sample(revisePrompt(line, raw, problems), { modelTier: 'quick', cache: false, onText: ({ delta }) => { raw += delta; rd2.push(delta); } }); rd2.end();
      c = check(b.input, {}); r.fixed.push(...c.fixed); problems = [...c.ask, ...(b.input ? [] : ['no building line'])];
    }
    r.left = problems;
  } catch (e) { r.left = [`호출 실패: ${e?.code ?? e?.message ?? e}`]; }
  r.raw = raw; r.ms = performance.now() - t0;
  if (b.input) {
    const n = normalize(b.input), main = n.masses.find(m => m.at === 'main') ?? n.masses[0];
    Object.assign(r, { built: true, input: b.input, type: n.type, style: n.style, levels: n.levels, family: n.family, sig: [n.type, main.roof.shape, main.ground, n.hero].join('/') });
  }
  return r;
}

$('go').onclick = async () => {
  if (!sample) { $('status').textContent = '이 화면에서는 Claude를 부를 수 없어요(claude.ai 안에서 열어 주세요).'; return; }
  const count = +$('count').value, revise = $('revise').value === '1';
  results = []; $('grid').replaceChildren(); stopReq = false; runId = 'r' + Date.now();
  $('go').disabled = true; $('stop').hidden = false; stats();
  if (db) try { await db.doc(`runs/${runId}`).set({ at: Date.now(), count, revise, version: 'parts-2' }); } catch { }
  for (let i = 0; i < Math.min(count, EVAL.length) && !stopReq; i++) {
    $('status').textContent = `${i + 1}/${count} 짓는 중: ${EVAL[i]}`;
    const r = await one(i, EVAL[i], revise); results.push(r); $('grid').append(card(r)); stats(); save(r);
  }
  if (db) try { await db.doc(`runs/${runId}`).update({ done: results.length }); } catch { }
  $('status').textContent = stopReq ? '멈춤' : '끝'; $('go').disabled = false; $('stop').hidden = true;
};
$('stop').onclick = () => { stopReq = true; };
stats();
</script>
</html>
