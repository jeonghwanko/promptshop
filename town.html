<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>promptshop — town</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  :root { --ground:#e8dcc4; --ink:#2e241a; --dim:#7a6a55; --card:#f3ead8; --line:#d4c4a6; --accent:#3f7a74; --hot:#c0392b; --gold:#e3a72f;
          --f-disp:"Jua","Noto Sans KR",sans-serif; --f-ui:"Noto Sans KR",system-ui,sans-serif; }
  body { margin:0; background:var(--ground); color:var(--ink); font:14px/1.55 var(--f-ui); padding:14px max(16px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width:1500px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  h1 { margin:0; font:400 28px/1.2 var(--f-disp); }
  .wallet { margin-left:auto; font:400 22px var(--f-disp); color:var(--gold); font-variant-numeric:tabular-nums; }
  .wants { display:flex; gap:8px; flex-wrap:wrap; }
  .want { display:flex; align-items:center; gap:6px; background:var(--card); border-radius:999px; padding:4px 12px 4px 6px; font-size:13px; }
  .want .dot { width:18px; height:18px; border-radius:50%; display:inline-block; }
  .want b { font-variant-numeric:tabular-nums; }
  .want.none { box-shadow:inset 0 0 0 2px var(--hot); } .want.none .tag { color:var(--hot); font-weight:700; }
  .main { display:grid; grid-template-columns:minmax(0, 1fr) 330px; gap:14px; align-items:start; }
  @media (max-width:980px) { .main { grid-template-columns:minmax(0, 1fr); } }
  .mapbox { background:#9cc786; border-radius:16px; overflow:auto; min-width:0; max-height:78vh; }
  #map { display:block; image-rendering:pixelated; cursor:pointer; }
  .panel { background:var(--card); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .panel h2 { margin:0; font:400 21px var(--f-disp); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text] { flex:1; min-width:0; font:15px var(--f-ui); padding:10px 11px; border-radius:10px; border:1px solid var(--line); background:#fbf6ec; color:var(--ink); }
  button { font:700 14px var(--f-ui); padding:9px 14px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; box-shadow:0 3px 0 #2a524e; }
  button:active:not(:disabled) { transform:translateY(2px); box-shadow:0 1px 0 #2a524e; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  button.warn { background:var(--hot); box-shadow:0 3px 0 #7a2418; }
  button.gold { background:var(--gold); box-shadow:0 3px 0 #9a6f14; color:#3a2a00; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; } .chips button { background:#fbf6ec; color:var(--ink); box-shadow:none; font-weight:400; padding:5px 9px; font-size:13px; }
  .log { font-size:12px; color:var(--dim); max-height:170px; overflow:auto; display:flex; flex-direction:column; gap:1px; }
  .log b { color:var(--accent); margin-right:6px; }
  .err { color:var(--hot); font-size:13px; } .note { color:var(--dim); font-size:13px; }
  .pics { display:flex; flex-direction:column; gap:8px; }
  .pics canvas { image-rendering:pixelated; max-width:100%; height:auto; display:block; margin:0 auto; }
  .secwrap { position:relative; margin-left:56px; } .secwrap canvas { max-width:100%; }
  .secwrap .lab { position:absolute; transform:translate(-100%, -50%); white-space:nowrap; background:var(--ink); color:#fff7e6; padding:0 5px; border-radius:6px; font-size:11px; }
  .secwrap .lab b { color:#e3b448; }
  .quote { font:400 16px var(--f-disp); }
  .stat { font-size:13px; } .stat b { font-variant-numeric:tabular-nums; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<div class="wrap">
  <header><h1>한 줄 마을</h1><span class="note" id="count"></span><span class="wallet" id="wallet"></span></header>
  <div class="wants" id="wants" aria-label="마을 사람들이 지금 원하는 것"></div>
  <div class="main">
    <div class="mapbox" id="mapbox"><canvas id="map"></canvas></div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>
<script type="module">
import { lineReader } from './src/steps.js';
import { Stage2 } from './src/v2/stage.js';
import { renderView } from './src/v2/render.js';
import { emptyBuilding, applyStep, buildPrompt } from './src/v2/steps.js';
import { check, missingParts, revisePrompt } from './src/v2/check.js';
import { normalize } from './src/v2/spec.js';
import { TYPE_KO } from './src/v2/catalog.js';
import { SEED } from './examples/town-seed.js';
import { LOTS, makeProjection, drawGround, lotAtPixel } from './src/v2/town.js';
import { TownSim, NEEDS, NEED_KEYS, roleOf, drawPerson } from './src/v2/townsim.js';

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn); else if (k === 'class') e.className = v; else e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c))); return e; };
const use = async (n) => (await window.claude?.use?.(n)?.catch?.(() => null)) ?? null;
const [db, user, sample] = await Promise.all([use('db'), use('user'), use('sample')]);
const me = user ? await user.id() : null, isOwner = user ? await user.isOwner() : false;
const MAX_PER_PERSON = 5, PRICE = { S: 0, M: 40, L: 150, XL: 500 };
const BAD = ['시발', '씨발', '병신', '좆', '개새', 'fuck', 'shit', 'bitch', 'nigger', 'nazi', '섹스', 'sex'];
const bad = (t) => BAD.some(w => (t ?? '').toLowerCase().includes(w));

// ---------- state ----------
const pr = makeProjection(230), map = $('map'); map.width = pr.width; map.height = pr.height;
map.style.width = '100%'; map.style.minWidth = pr.width + 'px'; map.style.maxWidth = pr.width * 2 + 'px';
const g = map.getContext('2d'); g.imageSmoothingEnabled = false;
let buildings = new Map(), ground = drawGround(pr), names = {};
const sprites = new Map(), sim = new TownSim(), pops = [];
let myDoc = { buildings: {}, wallet: { coins: 0, unlocked: ['S'] } }, dirty = false, lastSave = 0;
let building = null;      // the building being assembled on the map: { lot, stage }

function info(lotId, b) {   // normalized spec, cached per building version
  const k = b.author + ':' + b.at;
  if (b._k !== k) { b._n = normalize(b.input); b._k = k; }
  return b._n;
}
function sprite(lotId, b) {
  const key = b.author + ':' + b.at, s = sprites.get(lotId); if (s && s.key === key) return s;
  try { const { canvas, anchor } = renderView(b.input, 'ext'); const alpha = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data; const n = { canvas, anchor, key, alpha }; sprites.set(lotId, n); return n; } catch { return null; }
}
function applyBuildings(next) {
  buildings = next; ground = drawGround(pr, new Set(buildings.keys()));
  for (const lot of [...sprites.keys()]) if (!buildings.has(lot)) sprites.delete(lot);
  sim.setBuildings(new Map([...buildings].map(([id, b]) => { const n = info(id, b); return [id, { type: n.type, levels: n.levels, owner: b.author }]; })));
  $('count').textContent = `${buildings.size}/${LOTS.length} 부지`;
}
async function resolveNames() { if (!user) return; const ids = [...new Set([...buildings.values()].map(b => b.author).filter(a => a && a !== 'seed'))]; if (!ids.length) return; const ps = await user.profiles(ids); for (const id of ids) names[id] = ps[id]?.name || '이웃'; }
const authorName = (a) => a === 'seed' ? 'promptshop 예시' : a === me ? '나' : (names[a] || '이웃');

if (db) {
  db.collection('b').onSnapshot(snap => {
    const next = new Map();
    for (const d of snap.docs) {
      const data = d.data() ?? {};
      if (d.id === me) myDoc = { buildings: data.buildings ?? {}, wallet: { coins: Math.max(myDoc.wallet.coins, data.wallet?.coins ?? 0), unlocked: data.wallet?.unlocked ?? myDoc.wallet.unlocked } };
      for (const [lot, b] of Object.entries(data.buildings ?? {})) { if (!LOTS.some(l => l.id === lot) || !b?.input) continue; const cur = next.get(lot); if (!cur || (b.at ?? 0) < cur.at) next.set(lot, { ...b, author: d.id }); }
    }
    applyBuildings(next);
    resolveNames().then(() => { if (current?.kind === 'info') showInfo(current.lot); });
    if (!current) showIntro();
  }, () => { $('count').textContent = '마을을 불러오지 못했어요.'; });
} else {
  applyBuildings(new Map(Object.entries(SEED).map(([lot, b]) => [lot, { ...b, at: 0, author: 'seed' }])));
  $('count').textContent = '예시 마을 (claude.ai에서 열면 함께 짓는 마을)';
}
// coins are saved only for my own buildings, a few seconds after they change
async function save(force) {
  if (!db || !me) return;
  if (!force && (!dirty || performance.now() - lastSave < 5000)) return;
  dirty = false; lastSave = performance.now();
  try { await db.doc('b/' + me).set({ buildings: myDoc.buildings, wallet: myDoc.wallet }); } catch { dirty = true; }
}
setInterval(() => save(false), 2000);

// ---------- frame ----------
let last = performance.now(), drawn = [];
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  sim.step(dt);
  for (const e of sim.events.splice(0)) {
    const mine = !!me && e.owner === me; if (mine) { myDoc.wallet.coins += e.coins; dirty = true; }
    pops.push({ lot: e.lot, text: '+' + e.coins, mine, t: 0 });
  }
  for (const p of pops) p.t += dt; while (pops.length && pops[0].t > 1.4) pops.shift();
  g.clearRect(0, 0, map.width, map.height); g.drawImage(ground, 0, 0);
  // the selected lot is outlined on the ground, under buildings and people
  if (current?.lot) { const l = LOTS.find(x => x.id === current.lot); const pts = [pr.P(l.x, l.z), pr.P(l.x + l.w, l.z), pr.P(l.x + l.w, l.z + l.d), pr.P(l.x, l.z + l.d)];
    g.strokeStyle = '#ffd166'; g.lineWidth = 2; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.stroke(); }
  const items = [], tops = {};
  for (const [id, b] of buildings) {
    const l = LOTS.find(x => x.id === id), s = sprite(id, b); if (!s) continue;
    const [px, py] = pr.P(l.x + l.w / 2, l.z + l.d / 2); tops[id] = [px, py - s.anchor.y + 6];
    items.push({ d: l.x + l.w / 2 + l.z + l.d / 2, draw: () => g.drawImage(s.canvas, Math.round(px - s.anchor.x), Math.round(py - s.anchor.y)), id, s, px, py });
  }
  if (building) { const l = building.lot, st = building.stage, [px, py] = pr.P(l.x + l.w / 2, l.z + l.d / 2);
    items.push({ d: l.x + l.w / 2 + l.z + l.d / 2, draw: () => g.drawImage(st.canvas, Math.round(px - st.W / 2), Math.round(py - st.H * .82)) }); }
  for (const p of sim.people) items.push({ d: p.x + p.z - .01, draw: () => drawPerson(g, pr, p) });
  items.sort((a, b) => a.d - b.d); for (const it of items) it.draw();
  g.font = '900 12px "Noto Sans KR", sans-serif'; g.textAlign = 'center';
  for (const p of pops) { const t = tops[p.lot]; if (!t) continue; const y = t[1] - p.t * 22; g.globalAlpha = Math.max(0, 1 - p.t / 1.4); g.lineWidth = 3; g.strokeStyle = '#3a2a00'; g.strokeText(p.text, t[0], y); g.fillStyle = p.mine ? '#ffd166' : '#ffffff'; g.fillText(p.text, t[0], y); g.globalAlpha = 1; }
  drawn = items;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// what the town wants, and my coins
function hud() {
  const dm = sim.demand();
  $('wants').replaceChildren(...NEED_KEYS.map(k => { const d = dm[k], none = !d.served && d.waiting; return el('span', { class: 'want' + (none ? ' none' : '') }, el('span', { class: 'dot', style: `background:${NEEDS[k].color}` }), NEEDS[k].ko, el('b', {}, String(d.waiting)), none ? el('span', { class: 'tag' }, '· 마을에 없음') : null); }));
  $('wallet').textContent = me ? `동전 ${myDoc.wallet.coins.toLocaleString('ko-KR')}` : '';
}
setInterval(hud, 500); hud();

map.addEventListener('click', (e) => {
  if (building) return;
  const r = map.getBoundingClientRect(), sx = (e.clientX - r.left) * map.width / r.width, sy = (e.clientY - r.top) * map.height / r.height;
  for (const it of [...drawn].reverse()) {
    if (!it.s) continue; const x = Math.floor(sx - (it.px - it.s.anchor.x)), y = Math.floor(sy - (it.py - it.s.anchor.y));
    if (x < 0 || y < 0 || x >= it.s.canvas.width || y >= it.s.canvas.height) continue;
    if (it.s.alpha[(y * it.s.canvas.width + x) * 4 + 3] > 40) return showInfo(it.id);
  }
  const lot = lotAtPixel(pr, sx, sy);
  if (lot) buildings.has(lot.id) ? showInfo(lot.id) : showBuild(lot.id);
});
function focusLot(l) {   // bring the lot into view
  const box = $('mapbox'), k = map.clientWidth / map.width, [px, py] = pr.P(l.x + l.w / 2, l.z + l.d / 2);
  box.scrollTo({ left: px * k - box.clientWidth / 2, top: (py - 120) * k - box.clientHeight / 2, behavior: 'smooth' });
}

// ---------- panel ----------
let current = null;
const panel = $('panel');
const show = (...kids) => panel.replaceChildren(...kids.flat().filter(Boolean));   // optional parts may be null
function showIntro() {
  current = null;
  show(el('h2', {}, '한 줄 마을'),
    el('p', { class: 'note' }, '사람들 머리 위 말풍선이 지금 원하는 거예요. 위쪽에 빨갛게 "마을에 없음"이 뜬 걸 지어 주면, 그걸 원하는 사람들이 몰려와 줄을 서고 동전이 생겨요.'),
    el('p', { class: 'note' }, '집·아파트·역·호텔은 사람을 늘려요. 가게는 원하는 걸 채워요. 손님은 가장 가까운, 줄이 짧은 곳으로 가요.'),
    el('p', { class: 'note' }, `빈 부지(점선)를 눌러 한 줄로 지으세요. S 부지는 무료, M ${PRICE.M} · L ${PRICE.L} · XL ${PRICE.XL} 동전으로 열어요. 한 사람이 ${MAX_PER_PERSON}채까지.`));
}
const SUGGEST = { S: ['겨울 골목의 작은 붕어빵 노점', '24시간 편의점', '작은 2층 단독주택'], M: ['달빛 아래 한옥 찻집', '할머니가 하는 떡볶이 분식집', '네온사인 가득한 PC방'],
  L: ['12층 아파트', '레트로 볼링장', '붉은 벽돌 기차역'], XL: ['20층 럭셔리 호텔', '야간 경기가 있는 야구장', '탑이 있는 중세 성'] };

function fitToLot(input, lot) {
  // keep the whole footprint (wings included) inside the lot
  input.scale = lot.size;
  const n = normalize(input), m = n.masses.find(x => x.at === 'main') ?? n.masses[0];
  let w = m.size[0], d = m.size[1];
  for (const x of n.masses) { if (x === m) continue; if (x.at === 'left' || x.at === 'right') w += x.size[0]; if (x.at === 'back' || x.at === 'front') d += x.size[1]; }
  const k = Math.min(1, (lot.w - .4) / w, (lot.d - .7) / d);
  if (k < 1) { input.size = [m.size[0] * k, m.size[1] * k]; for (const x of input.masses ?? []) if (Array.isArray(x.size)) x.size = [x.size[0] * k, x.size[1] * k]; }
}

function showBuild(lotId) {
  const lot = LOTS.find(l => l.id === lotId); current = { kind: 'build', lot: lotId };
  const head = el('h2', {}, `빈 부지 ${lot.size} · ${lot.w}×${lot.d}칸`);
  if (!db || !me) return show(head, el('p', { class: 'note' }, 'claude.ai에 로그인하고 이 페이지에 Contributor 이상으로 초대받으면 지을 수 있어요.'));
  const mine = Object.keys(myDoc.buildings).length;
  if (mine >= MAX_PER_PERSON) return show(head, el('p', { class: 'note' }, `이미 ${MAX_PER_PERSON}채를 지었어요. 내 건물을 철거하면 다시 지을 수 있어요.`));
  if (!myDoc.wallet.unlocked.includes(lot.size)) {
    const buy = el('button', { class: 'gold' }, `${PRICE[lot.size]} 동전으로 ${lot.size} 부지 열기`); buy.disabled = myDoc.wallet.coins < PRICE[lot.size];
    buy.onclick = async () => { myDoc.wallet.coins -= PRICE[lot.size]; myDoc.wallet.unlocked = [...myDoc.wallet.unlocked, lot.size]; await save(true); showBuild(lotId); };
    return show(head, el('p', { class: 'note' }, `${lot.size} 부지는 아직 잠겨 있어요. 내 가게가 손님을 받으면 동전이 모여요. 지금 ${myDoc.wallet.coins}개.`), buy, el('button', { class: 'ghost', on: { click: showIntro } }, '닫기'));
  }
  const dm = sim.demand(), lack = NEED_KEYS.filter(k => !dm[k].served && dm[k].waiting).map(k => NEEDS[k].ko);
  const input = el('input', { type: 'text', id: 'line', maxlength: '80', placeholder: '예: ' + SUGGEST[lot.size][0] });
  const go = el('button', {}, '여기에 짓기'), err = el('div', { class: 'err' }), log = el('div', { class: 'log' });
  const chips = el('div', { class: 'chips' }, SUGGEST[lot.size].map(t => el('button', { on: { click: () => { input.value = t; build(); } } }, t)));
  show(head, lack.length ? el('p', { class: 'note' }, `지금 마을에 없는 것: ${lack.join(', ')}`) : null, el('div', { class: 'row' }, input, go), chips, err, log);
  const note = (tag, t) => { log.append(el('div', {}, el('b', {}, tag), t)); log.scrollTop = 1e9; };
  async function build() {
    const line = input.value.trim() || input.placeholder.replace(/^예: /, '');
    err.textContent = ''; log.replaceChildren();
    if (bad(line)) { err.textContent = '그 표현으로는 지을 수 없어요.'; return; }
    if (!sample) { err.textContent = '이 화면에서는 Claude를 부를 수 없어요.'; return; }
    go.disabled = true; focusLot(lot);
    const b = emptyBuilding(), stage = new Stage2({ width: 420, height: 400, lift: .82 }); building = { lot, stage };
    note('…', '구상 중');
    const seen = []; let raw = '', broken = 0;
    const apply = (s) => { if (s.step === 'floor' && s.replace && b.input) b.input.floors = []; const ch = applyStep(b, s); if (!ch) return; seen.push(s);
      if (ch.view === 'ext') { fitToLot(b.input, lot); stage.show(b.input, ch.key); } note({ building: '건물', main: '본관', mass: '덩어리', sign: '간판', hero: '대표', prop: '소품', floor: '층', fixture: '가구' }[s.step] ?? s.step, s.note || s.type || ''); };
    try {
      const rd = lineReader(apply, () => broken++);
      await sample(buildPrompt(line, { lot }), { modelTier: 'quick', cache: false, onText: ({ delta }) => { raw += delta; rd.push(delta); } }); rd.end();
      const c = check(b.input, { broken, line }); for (const f of c.fixed) note('수선', f);
      const problems = [...c.ask, ...missingParts(seen).filter(p => p === 'building').map(p => `The "${p}" line is missing.`)];
      if (problems.length) { note('다시', `남은 문제 ${problems.length}개`); let first = true; const rd2 = lineReader(s => { if (s.step === 'floor' && first) { s.replace = true; first = false; } apply(s); });
        await sample(revisePrompt(line, raw, problems), { modelTier: 'quick', cache: false, onText: ({ delta }) => rd2.push(delta) }); rd2.end(); check(b.input, { line }); }
      if (!b.input) throw { code: 'nothing' };
      fitToLot(b.input, lot);
      const n = normalize(b.input);
      if (bad(n.name)) { err.textContent = '그 이름으로는 세울 수 없어요.'; building = null; go.disabled = false; return; }
      if (buildings.has(lotId)) { err.textContent = '그 사이에 다른 사람이 이 부지에 지었어요.'; building = null; go.disabled = false; return; }
      // place it right away: the town reacts as soon as it stands
      myDoc.buildings = { ...myDoc.buildings, [lotId]: { input: JSON.parse(JSON.stringify(b.input)), line, at: Date.now() } };
      const next = new Map(buildings); next.set(lotId, { ...myDoc.buildings[lotId], author: me }); applyBuildings(next);
      building = null; await save(true);
      const role = roleOf(n.type, n.levels);
      note('완성', `${n.name || TYPE_KO[n.type]} · ${n.levels}층${role.serves ? ' — ' + NEEDS[role.serves].ko + '을(를) 채워요' : ''}${role.source ? ` · 사람 +${role.source}` : ''}`);
      setTimeout(() => { if (current?.lot === lotId) showInfo(lotId); }, 2500);
    } catch (e) { building = null; err.textContent = e?.code === 'rate_limited' ? '잠깐 쉬었다가 다시 눌러 주세요.' : e?.code === 'not_granted' ? 'Claude 사용을 허락해야 지을 수 있어요.' : '짓지 못했어요. 다시 눌러 주세요.'; }
    go.disabled = false;
  }
  go.onclick = build; input.addEventListener('keydown', e => { if (e.key === 'Enter') build(); });
}

function section(input) {
  const { canvas, labels } = renderView(input, 'section'); const wrap = el('div', { class: 'secwrap' }, canvas);
  for (const l of labels) { const e = el('span', { class: 'lab' }, l.text); e.style.left = (l.x / canvas.width * 100) + '%'; e.style.top = (l.y / canvas.height * 100) + '%'; if (l.count > 1) e.append(el('b', {}, ' ×' + l.count)); wrap.append(e); }
  return wrap;
}
function showInfo(lotId) {
  const b = buildings.get(lotId); if (!b) return showBuild(lotId);
  current = { kind: 'info', lot: lotId };
  const n = info(lotId, b), lot = LOTS.find(l => l.id === lotId), shop = sim.shops.get(lotId), role = roleOf(n.type, n.levels);
  const buttons = el('div', { class: 'row' });
  const mayDemolish = me && (b.author === me || isOwner);
  if (mayDemolish) buttons.append(el('button', { class: 'warn', on: { click: () => demolish(lotId, b) } }, '철거'));
  if (me && b.author !== me && b.author !== 'seed') buttons.append(el('button', { class: 'ghost', on: { click: (e) => report(lotId, b, e.target) } }, '신고'));
  buttons.append(el('button', { class: 'ghost', on: { click: showIntro } }, '닫기'));
  const what = [role.serves ? `${NEEDS[role.serves].ko}을(를) 채움` : null, role.source ? `사람 +${role.source}` : null].filter(Boolean).join(' · ') || '구경거리';
  show(el('h2', {}, n.name || TYPE_KO[n.type] || '건물'),
    el('div', { class: 'note' }, `${TYPE_KO[n.type] ?? n.type} · ${n.levels}층 · 부지 ${lot.size} · ${authorName(b.author)}`),
    el('div', { class: 'stat' }, what, shop?.serves ? el('span', {}, ' · 줄 ', el('b', {}, `${shop.queue.length}/${shop.cap}`), ' · 받은 손님 ', el('b', {}, String(shop.served))) : null),
    el('div', { class: 'quote' }, `“${b.line}”`),
    el('div', { class: 'pics' }, renderView(b.input, 'ext').canvas, section(b.input)), buttons);
}
async function demolish(lotId, b) {
  try {
    if (b.author === me) { const bs = { ...myDoc.buildings }; delete bs[lotId]; myDoc.buildings = bs; await save(true); }
    else { const ref = db.doc('b/' + b.author), cur = await ref.get(); const data = cur.data() ?? {}; const bs = { ...(data.buildings ?? {}) }; delete bs[lotId]; await ref.set({ ...data, buildings: bs }); }
    showIntro();
  } catch { panel.append(el('div', { class: 'err' }, '철거하지 못했어요.')); }
}
async function report(lotId, b, btn) {
  try { const ref = db.doc('r/' + me), cur = await ref.get(); const list = [...(cur.exists ? cur.data().items ?? [] : [])].slice(-50); list.push({ lot: lotId, author: b.author, at: Date.now() }); await ref.set({ items: list }); btn.textContent = '신고함'; btn.disabled = true; }
  catch { btn.textContent = '신고하지 못함'; }
}
showIntro();
</script>
</html>
