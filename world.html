</style>

<script type="module">

// ---------- shared state: every claimed plot in the world ----------
let plots = [];                 // { key, owner, X, Y, x, z, size, at, b? }

  for (const [owner, data] of docs) for (const [key, p] of Object.entries(data.plots ?? {})) if (p && PLOT[p.size] != null) all.push({ ...p, key, owner });

  refreshGlobe();
  if (area) refreshArea();

}

// ---------- globe ----------
let mode = 'globe', picked = null, area = null;
const globe = new Globe($('globebox'), { onPick: (lat, lng) => pick(lat, lng) });
$('zin').onclick = () => globe.zoom(1 / 1.4); $('zout').onclick = () => globe.zoom(1.4);
const spriteCache = new Map();

  const k = p.key + ':' + p.b.at; if (spriteCache.has(k)) return spriteCache.get(k);

  globe.setBuildings(plots.filter(p => p.b).map(p => { const n = PLOT[p.size]; const [lat, lng] = cellPoint(p.X, p.Y, (p.x + n / 2) / 20, (p.z + n / 2) / 20); return { lat, lng, canvas: buildingSprite(p) }; }).filter(b => b.canvas));

}

  globe.focus(r.lat, r.lng, r.zoomOut ? 2.2 : 1.35); globe.setMarker(r.lat, r.lng); pick(r.lat, r.lng, r.label); return true;
}

// ---------- panel: globe ----------
const panel = $('panel');
const show = (...kids) => panel.replaceChildren(...kids.flat().filter(Boolean));   // optional parts may be null

  input.addEventListener('input', () => dl.replaceChildren(...suggestions(input.value).map(s => el('option', { value: s }))));
  const err = el('div', { class: 'err' }), goBtn = el('button', {}, '찾기');
  const run = () => { err.textContent = ''; if (!go(input.value)) err.textContent = '찾지 못했어요. 다른 이름이나 좌표로 해 보세요.'; };

  return [el('div', { class: 'row' }, input, goBtn), dl, err];
}
function showGlobePanel() {
  const mine = plots.filter(p => p.owner === me);
  const parts = [el('h2', {}, '어디에 지을까요?'), ...searchBox(),
    el('div', { class: 'chips' }, ['서울', '부산', '제주', '도쿄', '파리', '뉴욕', '암스테르담', '발리'].map(c => el('button', { on: { click: () => go(c) } }, c)))];
  if (picked) {
    const here = plots.filter(p => p.X === picked.X && p.Y === picked.Y);
    const a = makeArea(picked.X, picked.Y);
    parts.push(el('div', { class: 'quote' }, picked.place.text), el('div', { class: 'note' }, `동네 좌표 X ${picked.X} · Y ${picked.Y} · 선점된 땅 ${here.length}곳`));
    parts.push(a.land ? el('button', { on: { click: () => enterArea(picked.X, picked.Y) } }, '이 동네로 들어가기') : el('div', { class: 'note' }, '바다예요. 땅을 찍어 주세요.'));
  } else parts.push(el('p', { class: 'note' }, '지구본을 드래그해서 돌리고, 원하는 곳을 찍으세요. 먼저 찍은 사람이 그 땅의 주인이 돼요.'));
  if (mine.length) parts.push(el('h2', {}, '내 땅'), el('div', { class: 'list' }, mine.map(p => {
    const [lat, lng] = cellCenter(p.X, p.Y), pl = placeLabel(lat, lng);
    return el('button', { on: { click: () => { globe.focus(lat, lng, 1.35); enterArea(p.X, p.Y); } } }, `${pl.text} · ${p.size}${p.b ? ' · ' + (normalize(p.b.input).name || '건물') : ' · 짓기 전'}`);
  })));

showGlobePanel();

// ---------- area ----------
const map = $('map'), g = map.getContext('2d');

function enterArea(X, Y) {
  area = makeArea(X, Y); mode = 'area'; current = null;
  pr = areaProjection(area); map.width = pr.width; map.height = pr.height; map.style.width = '100%'; map.style.minWidth = pr.width + 'px'; map.style.maxWidth = pr.width * 2 + 'px';
  g.imageSmoothingEnabled = false;
  sim = new TownSim(X * 31 + Y, { w: area.w, d: area.d, isRoad: area.isRoad, lots: [] });
  $('globebox').hidden = true; $('areabox').hidden = false; $('wants').hidden = false;
  $('where').textContent = area.place.text; $('coords').textContent = `X ${X} · Y ${Y}`;
  refreshArea(); showAreaPanel();
}
function leaveArea() { mode = 'globe'; area = null; sim = null; building = null; $('globebox').hidden = false; $('areabox').hidden = true; $('wants').hidden = true; showGlobePanel(); }
const areaPlots = () => plots.filter(p => p.X === area.X && p.Y === area.Y);
function refreshArea() {
  const ps = areaPlots(); ground = drawArea(area, pr, ps);
  const built = new Map(); for (const p of ps) if (p.b) { const n = normalize(p.b.input), w = PLOT[p.size]; built.set(p.key, { type: n.type, levels: n.levels, owner: p.owner, lot: { id: p.key, size: p.size, x: p.x, z: p.z, w, d: w } }); }

}
function sprite(p) {

  try { const { canvas, anchor } = renderView(p.b.input, 'ext'); const n = { canvas, anchor, k, alpha: canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data }; sprites.set(p.key, n); return n; } catch { return null; }
}
let last = performance.now();
function frame(t) {

    if (building) { const n = PLOT[building.plot.size], [px, py] = pr.P(building.plot.x + n / 2, building.plot.z + n / 2), st = building.stage; items.push({ d: building.plot.x + building.plot.z + n, draw: () => g.drawImage(st.canvas, Math.round(px - st.W / 2), Math.round(py - st.H * .82)) }); }

    items.sort((a, b) => a.d - b.d); for (const it of items) it.draw();

    for (const p of pops) { const tp = tops[p.key]; if (!tp) continue; const y = tp[1] - p.t * 22; g.globalAlpha = Math.max(0, 1 - p.t / 1.4); g.lineWidth = 3; g.strokeStyle = '#3a2a00'; g.strokeText(p.text, tp[0], y); g.fillStyle = p.mine ? '#ffd166' : '#ffffff'; g.fillText(p.text, tp[0], y); g.globalAlpha = 1; }

requestAnimationFrame(frame);
// ?area=X,Y opens a neighbourhood directly (handy for links and checks); ?q=서울 searches on load
{ const q = new URLSearchParams(location.search); if (q.get('q')) setTimeout(() => go(q.get('q')), 300); if (q.get('area')) { const [X, Y] = q.get('area').split(',').map(Number); setTimeout(() => enterArea(X, Y), 300); } }
function hud() {
  $('wallet').textContent = me ? `동전 ${myDoc.wallet.coins.toLocaleString('ko-KR')}` : '';
  if (mode !== 'area' || !sim) return;
  const dm = sim.demand();
  $('wants').replaceChildren(...NEED_KEYS.map(k => { const d = dm[k], none = !d.served && d.waiting; return el('span', { class: 'want' + (none ? ' none' : '') }, el('span', { class: 'dot', style: `background:${NEEDS[k].color}` }), NEEDS[k].ko, el('b', {}, String(d.waiting)), none ? el('span', { class: 'tag' }, '· 동네에 없음') : null); }));
}
setInterval(hud, 500); hud();

const mapXY = (e) => { const r = map.getBoundingClientRect(); return [(e.clientX - r.left) * map.width / r.width, (e.clientY - r.top) * map.height / r.height]; };
map.addEventListener('pointermove', (e) => {
  if (mode !== 'area' || building) return;
  const [sx, sy] = mapXY(e), [fx, fz] = pr.inv(sx, sy), n = PLOT[size];
  const x = Math.round(fx - n / 2), z = Math.round(fz - n / 2);
  hover = { x, z, ok: canPlace(area, x, z, size, takenTiles(areaPlots())) };
});
map.addEventListener('pointerleave', () => { hover = null; });
map.addEventListener('click', (e) => {
  if (mode !== 'area' || building) return;
  const [sx, sy] = mapXY(e);
  for (const it of [...drawn].reverse()) { if (!it.s) continue; const x = Math.floor(sx - (it.px - it.s.anchor.x)), y = Math.floor(sy - (it.py - it.s.anchor.y));
    if (x >= 0 && y >= 0 && x < it.s.canvas.width && y < it.s.canvas.height && it.s.alpha[(y * it.s.canvas.width + x) * 4 + 3] > 40) return showPlot(it.key); }
  const [fx, fz] = pr.inv(sx, sy), tx = Math.floor(fx), tz = Math.floor(fz);
  const own = areaPlots().find(p => tx >= p.x && tx < p.x + PLOT[p.size] && tz >= p.z && tz < p.z + PLOT[p.size]);
  if (own) return showPlot(own.key);
  if (hover?.ok) claim(hover.x, hover.z);
});

// ---------- panel: area ----------
function sizeChips(onPick) {
  return el('div', { class: 'chips sizes' }, Object.keys(PLOT).map(s => {
    const locked = !myDoc.wallet.unlocked.includes(s);
    return el('button', { class: s === size ? 'on' : '', on: { click: () => onPick(s) } }, `${s} ${PLOT[s]}×${PLOT[s]}${locked ? ` · ${PRICE[s]}` : ''}`);
  }));
}
function showAreaPanel(msg) {
  current = null;
  const mine = Object.values(myDoc.plots).filter(alive).length;
  show(...[el('h2', {}, area.place.text),
    el('div', { class: 'note' }, `X ${area.X} · Y ${area.Y} · 이 동네 건물 ${areaPlots().filter(p => p.b).length}채 · 선점 ${areaPlots().filter(p => !p.b).length}곳`),
    el('p', { class: 'note' }, '크기를 고르고 땅 위에서 틀을 움직이세요. 초록이면 찍을 수 있어요. 앞면이 길에 닿아야 해요. 찍는 순간 내 땅이 되고, 24시간 안에 지어야 해요.'),
    sizeChips((s) => { if (!myDoc.wallet.unlocked.includes(s)) return showUnlock(s); size = s; showAreaPanel(); }),
    el('div', { class: 'note' }, `내 땅 ${mine}/${MAX_PLOTS}`), msg ? el('div', { class: 'err' }, msg) : null,
    el('button', { class: 'ghost', on: { click: leaveArea } }, '지구본으로')]);
}
function showUnlock(s) {
  const buy = el('button', { class: 'gold' }, `${PRICE[s]} 동전으로 ${s} 땅 열기`); buy.disabled = myDoc.wallet.coins < PRICE[s];
  buy.onclick = async () => { myDoc.wallet.coins -= PRICE[s]; myDoc.wallet.unlocked = [...myDoc.wallet.unlocked, s]; size = s; await save(true); showAreaPanel(); };
  show(el('h2', {}, `${s} 땅은 잠겨 있어요`), el('p', { class: 'note' }, `내 가게가 손님을 받으면 동전이 모여요. 지금 ${myDoc.wallet.coins}개.`), buy, el('button', { class: 'ghost', on: { click: () => showAreaPanel() } }, '돌아가기'));
}
async function claim(x, z) {
  if (!db || !me) return showAreaPanel('claude.ai에 로그인하고 이 페이지에 Contributor 이상으로 초대받으면 땅을 찍을 수 있어요.');
  const live = Object.values(myDoc.plots).filter(alive).length;
  if (live >= MAX_PLOTS) return showAreaPanel(`땅은 ${MAX_PLOTS}곳까지예요. 짓지 않은 땅은 24시간 뒤 풀려요.`);
  const key = plotKey(area.X, area.Y, x, z);
  const fresh = Object.fromEntries(Object.entries(myDoc.plots).filter(([, p]) => alive(p)));
  myDoc.plots = { ...fresh, [key]: { X: area.X, Y: area.Y, x, z, size, at: now() } };
  plots = collect([[me, myDoc], ...groupOthers()]); refreshArea(); refreshGlobe();
  await save(true);
  showPlot(key);
}
const groupOthers = () => { const m = new Map(); for (const p of plots) if (p.owner !== me) { const d = m.get(p.owner) ?? { plots: {} }; d.plots[p.key] = p; m.set(p.owner, d); } return [...m]; };

const SUGGEST = { S: ['24시간 편의점', '동네 꽃집', '작은 단독주택'], M: ['동네 빵집', '분식집', '네온사인 PC방'], L: ['12층 아파트', '볼링장', '작은 기차역'], XL: ['20층 호텔', '야구장', '박물관'] };
function section(input) {
  const { canvas, labels } = renderView(input, 'section'); const wrap = el('div', { class: 'secwrap' }, canvas);
  for (const l of labels) { const e = el('span', { class: 'lab' }, l.text); e.style.left = (l.x / canvas.width * 100) + '%'; e.style.top = (l.y / canvas.height * 100) + '%'; if (l.count > 1) e.append(el('b', {}, ' ×' + l.count)); wrap.append(e); }
  return wrap;
}
function fitToLot(input, n) {
  input.scale = Object.keys(PLOT).find(k => PLOT[k] === n);
  const s = normalize(input), m = s.masses.find(x => x.at === 'main') ?? s.masses[0];
  let w = m.size[0], d = m.size[1];
  for (const x of s.masses) { if (x === m) continue; if (x.at === 'left' || x.at === 'right') w += x.size[0]; if (x.at === 'back' || x.at === 'front') d += x.size[1]; }
  const k = Math.min(1, (n - .4) / w, (n - .7) / d);
  if (k < 1) { input.size = [m.size[0] * k, m.size[1] * k]; for (const x of input.masses ?? []) if (Array.isArray(x.size)) x.size = [x.size[0] * k, x.size[1] * k]; }
}
function showPlot(key) {
  const p = areaPlots().find(x => x.key === key); if (!p) return showAreaPanel();
  current = { kind: p.b ? 'info' : 'claim', key };
  if (!p.b && p.owner !== me) return show(el('h2', {}, '선점된 땅'), el('div', { class: 'note' }, `${ownerName(p.owner)}의 땅 · ${p.size} · ${Math.max(0, Math.ceil((p.at + CLAIM_HOURS * 3600e3 - now()) / 3600e3))}시간 안에 짓지 않으면 풀려요`), el('button', { class: 'ghost', on: { click: () => showAreaPanel() } }, '돌아가기'));
  if (!p.b) return showBuild(p);
  const n = normalize(p.b.input), role = roleOf(n.type, n.levels), shop = sim.shops.get(key);
  const what = [role.serves ? `${NEEDS[role.serves].ko}을(를) 채움` : null, role.source ? `사람 +${role.source}` : null].filter(Boolean).join(' · ') || '구경거리';
  const buttons = el('div', { class: 'row' });
  if (me && (p.owner === me || isOwner)) buttons.append(el('button', { class: 'warn', on: { click: () => demolish(p) } }, '철거'));
  buttons.append(el('button', { class: 'ghost', on: { click: () => showAreaPanel() } }, '닫기'));
  show(el('h2', {}, n.name || TYPE_KO[n.type] || '건물'),
    el('div', { class: 'note' }, `${TYPE_KO[n.type] ?? n.type} · ${n.levels}층 · ${p.size} · ${ownerName(p.owner)}`),
    el('div', { class: 'note' }, what, shop?.serves ? ` · 줄 ${shop.queue.length}/${shop.cap} · 받은 손님 ${shop.served}` : ''),
    el('div', { class: 'quote' }, `“${p.b.line}”`), el('div', { class: 'pics' }, renderView(p.b.input, 'ext').canvas, section(p.b.input)), buttons);
}
function showBuild(p) {
  const n = PLOT[p.size], placeText = area.place.text;
  const dm = sim.demand(), lack = NEED_KEYS.filter(k => !dm[k].served && dm[k].waiting).map(k => NEEDS[k].ko);
  const input = el('input', { type: 'text', id: 'line', maxlength: '80', placeholder: '예: ' + SUGGEST[p.size][0] });
  const go = el('button', {}, '여기에 짓기'), err = el('div', { class: 'err' }), log = el('div', { class: 'log' });
  show(el('h2', {}, `내 땅 · ${p.size} ${n}×${n}`), el('div', { class: 'note' }, `${placeText} · ${Math.max(0, Math.ceil((p.at + CLAIM_HOURS * 3600e3 - now()) / 3600e3))}시간 안에 지어 주세요`),
    lack.length ? el('p', { class: 'note' }, `이 동네에 없는 것: ${lack.join(', ')}`) : null,
    el('div', { class: 'row' }, input, go), el('div', { class: 'chips' }, SUGGEST[p.size].map(t => el('button', { on: { click: () => { input.value = t; build(); } } }, t))), err, log,
    el('div', { class: 'row' }, el('button', { class: 'ghost', on: { click: () => release(p) } }, '땅 놓아주기'), el('button', { class: 'ghost', on: { click: () => showAreaPanel() } }, '닫기')));
  const note = (tag, t) => { log.append(el('div', {}, el('b', {}, tag), t)); log.scrollTop = 1e9; };
  async function build() {
    const line = input.value.trim() || input.placeholder.replace(/^예: /, '');
    err.textContent = ''; log.replaceChildren();
    if (bad(line)) { err.textContent = '그 표현으로는 지을 수 없어요.'; return; }
    if (!sample) { err.textContent = '이 화면에서는 Claude를 부를 수 없어요.'; return; }
    go.disabled = true;
    const b = emptyBuilding(), stage = new Stage2({ width: 420, height: 400, lift: .82 }); building = { plot: p, stage };
    note('…', '구상 중');
    const seen = []; let raw = '', broken = 0;
    const apply = (s) => { if (s.step === 'floor' && s.replace && b.input) b.input.floors = []; const ch = applyStep(b, s); if (!ch) return; seen.push(s);
      if (ch.view === 'ext') { fitToLot(b.input, n); stage.show(b.input, ch.key); } note({ building: '건물', main: '본관', mass: '덩어리', sign: '간판', hero: '대표', prop: '소품', floor: '층', fixture: '가구' }[s.step] ?? s.step, s.note || s.type || ''); };
    try {
      const lot = { size: p.size, w: n, d: n };
      const rd = lineReader(apply, () => broken++);
      await sample(buildPrompt(line, { lot, place: area.place.text }), { modelTier: 'quick', cache: false, onText: ({ delta }) => { raw += delta; rd.push(delta); } }); rd.end();
      const c = check(b.input, { broken, line }); for (const f of c.fixed) note('수선', f);
      const problems = [...c.ask, ...missingParts(seen).filter(x => x === 'building').map(x => `The "${x}" line is missing.`)];
      if (problems.length) { note('다시', `남은 문제 ${problems.length}개`); let first = true; const rd2 = lineReader(s => { if (s.step === 'floor' && first) { s.replace = true; first = false; } apply(s); });
        await sample(revisePrompt(line, raw, problems), { modelTier: 'quick', cache: false, onText: ({ delta }) => rd2.push(delta) }); rd2.end(); check(b.input, { line }); }
      if (!b.input) throw { code: 'nothing' };
      fitToLot(b.input, n); const s = normalize(b.input);
      if (bad(s.name)) { err.textContent = '그 이름으로는 세울 수 없어요.'; building = null; go.disabled = false; return; }
      myDoc.plots = { ...myDoc.plots, [p.key]: { ...myDoc.plots[p.key], b: { input: JSON.parse(JSON.stringify(b.input)), line, at: now() } } };
      plots = collect([[me, myDoc], ...groupOthers()]); building = null; refreshArea(); refreshGlobe();
      await save(true);
      const role = roleOf(s.type, s.levels);
      note('완성', `${s.name || TYPE_KO[s.type]} · ${s.levels}층${role.serves ? ' — ' + NEEDS[role.serves].ko + '을(를) 채워요' : ''}${role.source ? ` · 사람 +${role.source}` : ''}`);
      setTimeout(() => { if (current?.key === p.key) showPlot(p.key); }, 2500);
    } catch (e) { building = null; err.textContent = e?.code === 'rate_limited' ? '잠깐 쉬었다가 다시 눌러 주세요.' : e?.code === 'not_granted' ? 'Claude 사용을 허락해야 지을 수 있어요.' : '짓지 못했어요. 다시 눌러 주세요.'; }
    go.disabled = false;
  }
  go.onclick = build; input.addEventListener('keydown', e => { if (e.key === 'Enter') build(); });
}
async function release(p) { const ps = { ...myDoc.plots }; delete ps[p.key]; myDoc.plots = ps; plots = collect([[me, myDoc], ...groupOthers()]); refreshArea(); refreshGlobe(); await save(true); showAreaPanel(); }
async function demolish(p) {
  try {
    if (p.owner === me) return release(p);
    const ref = db.doc('p/' + p.owner), cur = await ref.get(), data = cur.data() ?? {}; const ps = { ...(data.plots ?? {}) }; delete ps[p.key]; await ref.set({ ...data, plots: ps }); showAreaPanel();
  } catch { panel.append(el('div', { class: 'err' }, '철거하지 못했어요.')); }
}
