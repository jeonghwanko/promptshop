<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>promptshop — build</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  :root { --ground:#e8dcc4; --ink:#2e241a; --dim:#7a6a55; --card:#f3ead8; --line:#d4c4a6; --accent:#3f7a74; --accent-ink:#fff; --hot:#e2432f;
          --f-disp:"Jua","Noto Sans KR",sans-serif; --f-ui:"Noto Sans KR",system-ui,sans-serif; }
  body { margin:0; background:var(--ground); color:var(--ink); font:15px/1.6 var(--f-ui); padding:20px max(16px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  h1 { margin:0; font:400 30px/1.2 var(--f-disp); }
  .ask { display:flex; gap:8px; flex-wrap:wrap; }
  .ask input { flex:1; min-width:220px; font:16px var(--f-ui); padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button { font:700 14px var(--f-ui); padding:10px 16px; border:0; border-radius:10px; background:var(--accent); color:var(--accent-ink); cursor:pointer; box-shadow:0 3px 0 #2a524e; }
  button:active:not(:disabled) { transform:translateY(2px); box-shadow:0 1px 0 #2a524e; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button { background:var(--card); color:var(--ink); box-shadow:none; font-weight:400; padding:6px 10px; font-size:13px; }
  .main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 260px; gap:14px; align-items:start; }
  @media (max-width:900px) { .main { grid-template-columns:minmax(0,1fr); } }
  .view { background:var(--card); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .view .lab0 { font-size:12px; color:var(--dim); font-weight:700; letter-spacing:.06em; }
  .view canvas { image-rendering:pixelated; width:100%; height:auto; display:block; }
  .secwrap { position:relative; margin-left:64px; }
  .secwrap canvas { max-height:640px; width:auto; max-width:100%; }
  .secwrap .lab { position:absolute; transform:translate(-100%, -50%); white-space:nowrap; background:var(--ink); color:#fff7e6; padding:0 6px; border-radius:6px; font-size:11px; }
  .secwrap .lab b { color:#e3b448; }
  .name { font:400 22px var(--f-disp); min-height:30px; }
  .log { background:var(--card); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:4px; max-height:560px; overflow:auto; font-size:13px; }
  .log .st { color:var(--dim); font-size:12px; }
  .log .row { display:flex; gap:8px; animation:in .25s ease-out; }
  .log .tag { flex:none; width:42px; color:var(--accent); font-weight:700; }
  @keyframes in { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { .log .row { animation:none; } }
  .err { color:var(--hot); font-size:13px; }
  details { font-size:12px; color:var(--dim); } pre { white-space:pre-wrap; word-break:break-all; font:11.5px/1.5 ui-monospace,monospace; background:var(--card); padding:10px; border-radius:10px; max-height:240px; overflow:auto; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<div class="wrap">
  <h1>한 줄 쓰면, 건물이 지어진다</h1>
  <div class="ask">
    <input id="line" type="text" maxlength="80" placeholder="예: 비 오는 날만 여는 우산 수리점">
    <button id="go">짓기</button><button id="stop" class="ghost" hidden>멈추기</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="err" id="err"></div>
  <div class="name" id="name"></div>
  <div class="main">
    <div class="view"><span class="lab0">겉 · 마을 지도</span><div id="ext"></div></div>
    <div class="view"><span class="lab0">속 · 층 단면</span><div id="int"></div></div>
    <div class="log" id="log"><span class="st">공사 기록</span></div>
  </div>
  <details><summary>받은 설계도 (JSON Lines)</summary><pre id="raw"></pre></details>
</div>
<script type="module">
import { lineReader } from './src/steps.js';
import { Stage2 } from './src/v2/stage.js';
import { renderView } from './src/v2/render.js';
import { emptyBuilding, applyStep, buildPrompt } from './src/v2/steps.js';
import { check, missingParts, revisePrompt } from './src/v2/check.js';
import { STREAMS } from './examples/streams.js';

await document.fonts.load('900 18px "Noto Sans KR"').catch(() => {});
const ext = new Stage2();
document.getElementById('ext').append(ext.canvas);
// the stacked cross-section is re-drawn whole after each step; floor labels sit outside the picture
function showSection(input) {
  const host = document.getElementById('int'); host.replaceChildren();
  if (!input) return;
  const { canvas, labels } = renderView(input, 'section');
  const wrap = document.createElement('div'); wrap.className = 'secwrap'; wrap.append(canvas);
  for (const l of labels) { const e = document.createElement('span'); e.className = 'lab'; e.style.left = (l.x / canvas.width * 100) + '%'; e.style.top = (l.y / canvas.height * 100) + '%';
    e.textContent = l.text; if (l.count > 1) { const b = document.createElement('b'); b.textContent = ' ×' + l.count; e.append(b); } wrap.append(e); }
  host.append(wrap);
}
const $ = (id) => document.getElementById(id);
const TAG = { fix: '수선', ask: '다시', building: '건물', main: '본관', mass: '덩어리', sign: '간판', hero: '대표', prop: '소품', floor: '층', fixture: '가구' };

let shop, queue = [], pumping = false, run = 0, seen = [];
function reset() { shop = emptyBuilding(); queue = []; seen = []; ext.clear(); showSection(null); $('name').textContent = ''; $('raw').textContent = '';
  $('log').replaceChildren(Object.assign(document.createElement('span'), { className: 'st', textContent: '공사 기록' })); }
// Steps can arrive faster than the eye; show them at least 260 ms apart.
function enqueue(step, myRun) { queue.push([step, myRun]); if (!pumping) pump(); }
async function pump() {
  pumping = true;
  while (queue.length) {
    const [step, myRun] = queue.shift(); if (myRun !== run) continue;
    if (step.step === 'floor' && step.replace && shop.input) { shop.input.floors = []; }
    const ch = applyStep(shop, step); if (!ch) continue; seen.push(step);
    if (step.step === 'building') $('name').textContent = shop.input.name || '';
    if (ch.view === 'ext') ext.show(shop.input, ch.key);
    if (ch.view === 'int' || step.step === 'building') showSection(shop.input);
    { const r = document.createElement('div'); r.className = 'row';
      const t = document.createElement('span'); t.className = 'tag'; t.textContent = TAG[step.step] ?? step.step;
      const n = document.createElement('span'); n.textContent = (typeof step.note === 'string' && step.note) || step.type || ''; r.append(t, n); $('log').append(r); $('log').scrollTop = 1e9; }
    await new Promise(r => setTimeout(r, 260));
  }
  pumping = false;
}
function note(tag, text) { const r = document.createElement('div'); r.className = 'row'; const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag; const n = document.createElement('span'); n.textContent = text; r.append(t, n); $('log').append(r); $('log').scrollTop = 1e9; }
const idle = () => new Promise(r => { const t = setInterval(() => { if (!pumping && !queue.length) { clearInterval(t); r(); } }, 60); });
// After the stream: repair cheaply, then ask the model once for what is still wrong.
async function quality(line, raw, broken, my) {
  await idle(); if (my !== run) return;
  const miss = missingParts(seen).filter(p => p === 'building');
  const { fixed, ask } = check(shop.input, { broken, line });
  for (const f of fixed) note(TAG.fix, f);
  if (fixed.length && shop.input) { ext.show(shop.input, 'all'); showSection(shop.input); }
  const problems = [...ask, ...miss.map(p => `The "${p}" line is missing.`)];
  if (!problems.length || !sample) return;
  note(TAG.ask, `남은 문제 ${problems.length}개를 다시 물어봄`);
  let first = true;
  const reader = lineReader((s) => { if (s.step === 'floor' && first) { s.replace = true; first = false; } enqueue(s, my); });
  try { await sample(revisePrompt(line, raw, problems), { modelTier: 'quick', cache: false, onText: ({ delta }) => reader.push(delta) }); reader.end(); }
  catch (e) { reader.end(); note(TAG.ask, '다시 묻기 실패'); }
  await idle(); if (my !== run) return;
  const after = check(shop.input, {}); for (const f of after.fixed) note(TAG.fix, f);
  if (shop.input) { ext.show(shop.input, 'all'); showSection(shop.input); }
}
function replay(steps) { reset(); const my = ++run; $('name').textContent = ''; for (const s of steps) enqueue(s, my); }

const EXAMPLES = ['20층 럭셔리 호텔', '달빛 아래 한옥 찻집', '역대 챔피언들의 장갑과 벨트를 전시하는 넓은 전시장', '옥상에 돔이 있는 4층짜리 오래된 백화점', '겨울 골목의 작은 붕어빵 노점', '밤에만 여는 청록 기와 포장마차 라멘집', '고양이가 주인인 작은 2층 북카페', '네온 간판 번쩍이는 격투 굿즈 상점', '비 오는 날만 여는 우산 수리점', '할머니가 하는 떡볶이 분식집'];
for (const ex of EXAMPLES) { const b = document.createElement('button'); b.textContent = ex; b.onclick = () => { $('line').value = ex; build(); }; $('chips').append(b); }

const sample = (await window.claude?.use?.('sample')?.catch?.(() => null)) ?? null;
let ctl = null;
async function build() {
  const line = $('line').value.trim() || $('line').placeholder.replace(/^예: /, '');
  $('err').textContent = '';
  if (!sample) { $('err').textContent = '이 화면에서는 Claude를 부를 수 없어서 예시만 다시 보여 줍니다.'; replay(STREAMS.hotel); return; }
  reset(); const my = ++run; ctl = new AbortController();
  $('go').disabled = true; $('stop').hidden = false; $('name').textContent = '구상 중…';
  let broken = 0;
  const reader = lineReader((s) => enqueue(s, my), () => broken++);
  try {
    await sample(buildPrompt(line), { modelTier: 'quick', cache: false, signal: ctl.signal,
      onText: ({ delta }) => { $('raw').textContent += delta; reader.push(delta); } });
    reader.end();
    await quality(line, $('raw').textContent, broken, my);
  } catch (e) {
    reader.end();
    const c = e && e.code;
    if (c !== 'cancelled') $('err').textContent =
      c === 'not_granted' || c === 'sampling_disabled' ? 'Claude 사용이 허락되지 않아 지을 수 없어요.' :
      c === 'rate_limited' ? '잠깐 쉬었다가 다시 눌러 주세요.' :
      c === 'refused' ? '이 설명으로는 짓지 못했어요. 다르게 써 주세요.' : '중간에 끊겼어요. 다시 눌러 주세요.';
  } finally { $('go').disabled = false; $('stop').hidden = true; if ($('name').textContent === '구상 중…') $('name').textContent = ''; }
}
$('go').onclick = build; $('line').addEventListener('keydown', (e) => { if (e.key === 'Enter') build(); });
$('stop').onclick = () => ctl?.abort();
replay(STREAMS.hotel);   // the page opens on a replay of an example build
</script>
</html>
