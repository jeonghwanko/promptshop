  const p = +(Q.get('pitch') ?? 0.17), yaws = [0, 0.62, -Math.PI / 2];
  const img = new Image(); img.src = '../art/gull/turnaround-1.png'; img.style.height = '330px'; await img.decode();

  r2.append(fig(shot(Math.PI, p), 'back')); r2.append(fig(shot(VIEW.yaw, VIEW.pitch, 90, 110, { view: 1 }), 'normals')); r2.append(fig(shot(VIEW.yaw, VIEW.pitch, 90, 110, { view: 2 }), 'AO'));

if (mode === 'aim') {   // the game view, pointing at screen angles (degrees, 0 = right, 90 = up)

}
