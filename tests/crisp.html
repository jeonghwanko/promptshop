<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>crisp compare</title>
<style> body { margin:0; background:#e8dcc4; font:13px system-ui; padding:12px; } .row { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-end; } figure { margin:0; text-align:center; } canvas { image-rendering:pixelated; display:block; } </style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<div class="row" id="out"></div>
<script type="module">
import { renderView } from '../src/v2/render.js';
import { SPECS } from '../examples/specs.js';
const q = new URLSearchParams(location.search), zoom = +(q.get('zoom') ?? 2), view = q.get('view') ?? 'ext';
const list = [{ type: 'kiosk', name: '붕어빵', levels: 1 }, { type: 'cafe', levels: 2 }, { type: 'convenience_store', levels: 1 }, { type: 'hanok_house', levels: 1 }, { type: 'bowling_alley', levels: 1 }];
for (const input of list) for (const crisp of [false, true]) {
  const { canvas } = renderView(input, view, { crisp });
  canvas.style.width = canvas.width * zoom + 'px';
  const f = document.createElement('figure'); const c = document.createElement('figcaption'); c.textContent = `${input.type} · ${crisp ? '새 (외곽선·셀·AO)' : '지금'}`; f.append(canvas, c); document.getElementById('out').append(f);
}
document.title = 'DONE';
</script>
</html>
