<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>promptshop — sections</title>
<style>
  body { margin:0; background:#e8dcc4; color:#2e241a; font:13px/1.5 system-ui, "Noto Sans KR", sans-serif; padding:16px; }
  .row { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; }
  .sec { position:relative; } .sec canvas { image-rendering:pixelated; display:block; }
  .lab { position:absolute; transform:translate(-100%, -50%); white-space:nowrap; background:#2e241a; color:#fff7e6; padding:1px 6px; border-radius:6px; font-size:12px; }
  .lab b { color:#e3b448; margin-left:4px; }
  h3 { margin:4px 0 0; font-size:14px; text-align:center; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<div class="row" id="out"></div>
<script type="module">
import { renderView } from './src/v2/render.js';
import { TYPE_KO } from './src/v2/catalog.js';
const q = new URLSearchParams(location.search), zoom = +(q.get('zoom') ?? 1);
const list = (q.get('types') ?? 'hotel:20,school:3,cafe:1,apartment:12,hospital:6,museum:2,factory:1,restaurant:2').split(',');
for (const t of list) {
  const [type, levels] = t.split(':');
  const { canvas, labels } = renderView({ type, levels: +levels }, 'section');
  const box = document.createElement('div'); box.className = 'sec'; box.style.paddingLeft = '90px';
  canvas.style.width = canvas.width * zoom + 'px'; box.append(canvas);
  for (const l of labels) { const e = document.createElement('div'); e.className = 'lab'; e.style.left = 90 + l.x * zoom + 'px'; e.style.top = l.y * zoom + 'px'; e.textContent = l.text; if (l.count > 1) { const b = document.createElement('b'); b.textContent = '×' + l.count; e.append(b); } box.append(e); }
  const h = document.createElement('h3'); h.textContent = `${TYPE_KO[type] ?? type} ${levels}층`;
  const fig = document.createElement('div'); fig.append(box, h); document.getElementById('out').append(fig);
}
</script>
</html>
