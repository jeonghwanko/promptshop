<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>promptshop — isles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="src/game/isles.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<div class="mapbox" id="mapbox"><canvas id="map"></canvas></div>
<div class="hud tl"><button class="isleb" id="who"></button><button class="autot" id="d-auto" title="가구 자동으로 들이기"><span class="ic" data-i="chair"></span><span id="d-auto-t">자동</span><i class="sw"></i></button></div>
<button class="festp" id="festp" hidden></button>
<div class="hud tr"><div class="coinb" id="coinb"><span class="cic"></span><b id="wallet"></b><small id="rate"></small></div><div class="zoomb"><button class="zb" id="zin" title="가까이" aria-label="가까이">+</button><button class="zb" id="zout" title="멀리" aria-label="멀리">−</button></div></div>
<aside class="panel" id="panel" hidden></aside>
<div class="shopwrap" id="shopwrap" hidden><div class="shopstage" id="shopstage"></div><div class="shopacts" id="shopacts"></div></div>
<div class="world" id="world" hidden><canvas class="wmap" id="wmap"></canvas><div id="spots"></div>
  <div class="wtop"><div class="plate" data-icon-size="32">🌏<span>세계</span><small id="wcount"></small></div><span class="grow"></span><button class="gold" id="wnew">새 군도</button><button class="xb" id="wclose"></button></div>
  <div class="wzoom zoomb"><button class="zb" id="wplus" aria-label="가까이">+</button><button class="zb" id="wminus" aria-label="멀리">−</button></div><div class="wcard" id="wcard" hidden></div></div>
<div class="toast" id="toast" hidden></div>
<div class="cards" id="cards" hidden></div>
<div class="guide" id="guide" hidden><div class="gbird"></div><div class="gbub"><div class="gname">끼룩이</div><div id="gtext"></div><div class="grow2" id="gbtns"></div></div></div>
<div class="garrow" id="garrow" hidden>▼</div>
<nav class="dock" id="dock">
  <div class="dl"><button class="rb" id="d-world"><span class="ic" data-v="globe"></span><span class="lb">세계</span></button>
    <button class="rb" id="d-home"><span class="ic" data-v="island"></span><span class="lb">내 섬</span></button>
</div>
  <div class="dr"><div class="sizes" id="sizes" hidden></div>
    <button class="rb boatb" id="boat" hidden><span class="ring" id="boatring"></span><span class="ic" data-v="boat" id="boatic"></span><span class="cnt" id="boatn"></span><span class="lb" id="boatt"></span></button>
    <button class="rb big" id="d-build"><span class="ic" data-v="hammer"></span><span class="lb">짓기</span></button></div>
</nav>
<script type="module" src="src/game/main.js"></script>
</html>
