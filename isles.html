<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 줄 군도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="src/game/isles.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>
<div class="mapbox" id="mapbox"><canvas id="map"></canvas></div>
<div id="boot" style="position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#3d7fa6;color:#fff;font:400 34px Jua,'Noto Sans KR',sans-serif;text-shadow:0 3px 0 #2e241a;transition:opacity .4s">한 줄 군도</div>
<script>setTimeout(() => { const b = document.getElementById('boot'); if (b) b.innerHTML = '<div style="text-align:center">한 줄 군도<br><button onclick="location.reload()" style="margin-top:14px;font:inherit;font-size:20px;padding:6px 18px;border:0;border-radius:12px;background:#3f7a74;color:#fff">다시</button></div>'; }, 20000);</script>   <!-- the game did not start in 20 s (a module failed to load): a way out -->
<div class="hud tl"><button class="isleb" id="who"></button><button class="autot" id="d-auto" title="가구 자동으로 들이기"><span class="ic" data-i="chair"></span><span id="d-auto-t">자동</span><i class="sw"></i></button></div>
<button class="festp" id="festp" hidden></button>
<div class="hud tr"><div class="coinb" id="coinb"><span class="cic"></span><b id="wallet"></b><span class="pmt" id="pmt" title="전기 · 물"></span><small id="rate"></small></div><div class="zoomb"><button class="zb" id="zin" title="가까이" aria-label="가까이">+</button><button class="zb" id="zout" title="멀리" aria-label="멀리">−</button></div></div>
<aside class="panel" id="panel" hidden></aside>
<div class="shopwrap" id="shopwrap" hidden><div class="shopstage" id="shopstage"></div><div class="shopacts" id="shopacts"></div></div>
<div class="world" id="world" hidden><canvas class="wmap" id="wmap"></canvas><div id="spots"></div>
  <div class="wtop"><div class="plate" data-icon-size="32">🌏<span>세계</span><small id="wcount"></small></div><span class="grow"></span><button class="gold" id="wnew">새 군도</button><button class="xb" id="wclose"></button></div>
  <div class="wzoom zoomb"><button class="zb" id="wplus" aria-label="가까이">+</button><button class="zb" id="wminus" aria-label="멀리">−</button></div><div class="wcard" id="wcard" hidden></div></div>
<div class="toast" id="toast" hidden></div>
<div class="guide" id="guide" hidden><div class="gbird"></div><div class="gbub"><div class="gname">끼룩이</div><div id="gtext"></div><div class="grow2" id="gbtns"></div></div></div>
<div class="garrow" id="garrow" hidden>▼</div>
<div class="gspot" id="gspot" hidden></div>
<nav class="dock" id="dock">
  <div class="dl"><button class="rb" id="d-world"><span class="ic" data-v="globe"></span><span class="lb">세계</span></button>
    <button class="rb" id="d-home"><span class="ic" data-v="island"></span><span class="lb">내 섬</span></button>
</div>
  <div class="dm ask" id="ask" hidden>
    <div class="wants" id="wants"></div>
    <div class="berr" id="berr" hidden></div>
    <div class="bar" id="bar"><span class="bwho" id="bwho"></span>
      <div class="bmid"><input id="line" type="text" maxlength="80" autocomplete="off" enterkeyhint="go" placeholder="무엇을 지을까?" aria-label="무엇을 지을까?"><div class="bsub" id="bsub"></div></div>
      <div class="bsize" id="bsize" hidden></div><button class="bx" id="bx" hidden aria-label="그만">×</button><button class="bgo" id="bgo" hidden></button></div>
  </div>
  <div class="dr"><button class="rb boatb" id="boat" hidden><span class="ring" id="boatring"></span><span class="ic" data-v="boat" id="boatic"></span><span class="cnt" id="boatn"></span><span class="lb" id="boatt"></span></button></div>
</nav>
<script type="module" src="src/game/main.js"></script>
</html>
