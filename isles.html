<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>promptshop — isles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  :root { --ground:#e8dcc4; --ink:#2e241a; --dim:#7a6a55; --card:#f3ead8; --line:#d4c4a6; --accent:#3f7a74; --hot:#c0392b; --gold:#e3a72f; --sea:#3d7fa6;
          --f-disp:"Jua","Noto Sans KR",sans-serif; --f-ui:"Noto Sans KR",system-ui,sans-serif; }
  html, body { height:100%; overflow:hidden; }
  body { margin:0; background:var(--sea); color:var(--ink); font:14px/1.55 var(--f-ui); }
  .mapbox { position:fixed; inset:0; overflow:auto; scrollbar-width:none; cursor:grab; touch-action:none; background:var(--sea); }
  .mapbox::-webkit-scrollbar { display:none; } .mapbox.drag { cursor:grabbing; }
  #map { display:block; image-rendering:pixelated; margin:40vh 30vw; }   /* sea around the world so any island can come to any part of the screen */
  .hud { position:fixed; z-index:5; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  .pill { background:rgba(251,246,236,.95); border-radius:14px; padding:6px 12px; box-shadow:0 3px 0 rgba(20,40,60,.35); display:flex; align-items:center; gap:8px; }
  .tl { top:12px; left:12px; align-items:flex-start; } .tr { top:12px; right:12px; align-items:flex-end; z-index:16; }
  .isle { font:400 20px var(--f-disp); } .isle small { font:400 13px var(--f-ui); color:var(--dim); margin-left:6px; }
  .coins { font:400 24px var(--f-disp); color:#b07a12; font-variant-numeric:tabular-nums; } .coins i { font-style:normal; display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--gold); color:#6a4500; font:900 13px var(--f-ui); box-shadow:inset 0 -2px 0 #9a6f14; }
  .boatline.callable { cursor:pointer; background:#fff3cf; box-shadow:0 3px 0 #9a6f14; animation:nudge 1.6s infinite; } .callb { margin-left:6px; color:#b0560e; } .callw { color:var(--dim); }
  .fixbtn { padding:7px 14px; animation:nudge 1.6s infinite; } .fixbtn:disabled { animation:none; }
  .stars { color:#c98f1c; font-size:18px; letter-spacing:1px; } .checks { display:flex; flex-wrap:wrap; gap:4px; } .checks span { font-size:12px; background:#efe6d4; color:var(--dim); border-radius:999px; padding:1px 8px; } .checks span.ok { background:#dcefd8; color:#2f6b3a; font-weight:700; }
  .rate { font-size:13px; color:var(--accent); font-weight:700; } .boatline { font-size:13px; }
  .dock { position:fixed; z-index:7; left:12px; right:12px; bottom:12px; display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none; }
  .dock > div { display:flex; gap:10px; align-items:flex-end; pointer-events:auto; }
  .rb { position:relative; display:flex; flex-direction:column; align-items:center; gap:0; width:58px; height:58px; padding:0; justify-content:center; border-radius:18px; background:#fbf1dc; color:var(--ink);
        box-shadow:inset 0 0 0 3px #2e241a, inset 0 -6px 0 #d9c49a, 0 4px 0 rgba(20,30,40,.45); }
  .rb .ic { width:32px; height:32px; display:block; } .rb .ic img { width:32px; height:32px; image-rendering:pixelated; display:block; }
  .rb .lb { position:absolute; top:100%; margin-top:3px; font:400 13px var(--f-disp); color:#fff; white-space:nowrap; -webkit-text-stroke:3px #2e241a; paint-order:stroke fill; }
  :is(.dock, .zoomb) .rb { margin-bottom:18px; }
  .rb:hover { background:#fff8e6; } .rb:active:not(:disabled) { transform:translateY(3px); box-shadow:inset 0 0 0 3px #2e241a, inset 0 -3px 0 #d9c49a, 0 1px 0 rgba(20,30,40,.45); }
  .rb.on { background:#ffe08a; box-shadow:inset 0 0 0 3px #2e241a, inset 0 -6px 0 #d9a52a, 0 4px 0 rgba(20,30,40,.45); }
  .rb.sm { width:46px; height:46px; border-radius:14px; } .rb.sm .ic, .rb.sm .ic img { width:24px; height:24px; }
  .rb.sm::after { content:''; position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:2px; background:#a99a80; box-shadow:0 0 0 2px #2e241a; } .rb.sm.on::after { background:#4fd16b; }
  .rb.big { width:84px; height:84px; border-radius:24px; background:var(--gold); box-shadow:inset 0 0 0 3px #2e241a, inset 0 -8px 0 #b47d14, 0 5px 0 rgba(20,30,40,.45); }
  .rb.big .ic, .rb.big .ic img { width:48px; height:48px; } .rb.big .lb { font-size:16px; }
  .rb.big:hover { background:#f2bb45; } .rb.big.on { background:#fbf1dc; }
  .rb .badge { position:absolute; top:-8px; right:-8px; min-width:26px; height:26px; display:grid; place-items:center; padding:0 6px; border-radius:13px; background:var(--hot); color:#fff; font:400 15px var(--f-disp); box-shadow:0 0 0 3px #2e241a; }
  .rb.ready { animation:nudge 1.6s infinite; } @keyframes nudge { 0%, 70%, 100% { transform:none; } 80% { transform:translateY(-6px); } 90% { transform:translateY(0); } }
  .boatb { width:64px; height:64px; border-radius:50%; } .boatb .ic, .boatb .ic img { width:36px; height:36px; }
  .boatb .ring { position:absolute; inset:5px; border-radius:50%; background:conic-gradient(var(--sea) calc(var(--p,0) * 1turn), rgba(61,127,166,.15) 0); -webkit-mask:radial-gradient(circle, transparent 58%, #000 60%); mask:radial-gradient(circle, transparent 58%, #000 60%); }
  .boatb .cnt { position:absolute; top:-6px; left:-6px; min-width:24px; height:22px; display:grid; place-items:center; padding:0 5px; border-radius:11px; background:#fbf1dc; color:var(--ink); font:400 14px var(--f-disp); box-shadow:0 0 0 3px #2e241a; }
  .boatb .cnt:empty { display:none; }

  .boatb.callable { background:#ffe08a; animation:nudge 1.6s infinite; } .boatb.callable .ring { display:none; }
  .boatb.idle { opacity:.55; }
  .dock .sizes { display:flex; gap:6px; align-self:center; margin-bottom:18px; } .dock .sizes[hidden] { display:none; }
  .dock .sizes button { min-width:54px; background:#fbf1dc; color:var(--ink); box-shadow:inset 0 0 0 3px #2e241a, 0 3px 0 rgba(20,30,40,.45); font:400 16px var(--f-disp); }
  .dock .sizes button.on { background:var(--gold); color:#3a2a00; }
  .isleb { display:flex; align-items:center; gap:10px; padding:4px 14px 4px 4px; border-radius:30px; background:rgba(46,36,26,.82); color:#fbf1dc; box-shadow:0 4px 0 rgba(20,30,40,.35); font:400 18px var(--f-disp); }
  .isleb:hover { background:rgba(46,36,26,.92); } .isleb:active:not(:disabled) { transform:translateY(2px); box-shadow:0 2px 0 rgba(20,30,40,.35); }
  .isleb .lvr { position:relative; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(#ffd166 calc(var(--p,0) * 1turn), rgba(255,255,255,.18) 0); }
  .isleb .lvr b { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:#fff; font:400 20px var(--f-disp); box-shadow:inset 0 -3px 0 #2a524e; }
  .isleb .nm { display:flex; flex-direction:column; align-items:flex-start; line-height:1.15; } .isleb .nm small { font:400 12px var(--f-disp); color:#e6d3ad; }
  .isleb .tk { display:flex; align-items:center; gap:3px; font:400 20px var(--f-disp); color:#ffd166; } .isleb .tk img { width:24px; height:24px; image-rendering:pixelated; }
  .isleb .tk.got { animation:pop2 .5s; } @keyframes pop2 { 40% { transform:scale(1.4); } }
  .coinb[hidden] { display:none; } .rb[hidden] { display:none; }
  .coinb { position:relative; display:flex; align-items:center; gap:6px; padding:4px 16px 4px 6px; border-radius:30px; background:rgba(46,36,26,.82); box-shadow:0 4px 0 rgba(20,30,40,.35); }
  .coinb .cic img { width:36px; height:36px; image-rendering:pixelated; display:block; }
  .coinb b { font:400 28px var(--f-disp); color:#ffd166; font-variant-numeric:tabular-nums; min-width:2ch; text-align:right; }
  .coinb small { position:absolute; top:100%; right:14px; margin-top:4px; font:400 14px var(--f-disp); color:#fff; -webkit-text-stroke:3px #2e241a; paint-order:stroke fill; }
  .dock, .hud.tl { transition:opacity .25s, transform .25s; } body.inshop .dock, body.inshop .hud.tl { opacity:0; pointer-events:none; transform:translateY(12px); } body.inshop .dock > div { pointer-events:none; }
  @media (max-width:440px) { .dock > div { gap:7px; } .rb { width:48px; height:48px; border-radius:15px; } .rb .ic, .rb .ic img { width:28px; height:28px; } .rb.sm { width:40px; height:40px; } .rb.big { width:70px; height:70px; } .rb.big .ic, .rb.big .ic img { width:40px; height:40px; } .boatb { width:54px; height:54px; } .boatb .ic, .boatb .ic img { width:30px; height:30px; } .rb .lb { font-size:12px; } .isleb .nm small { display:none; } .coinb b { font-size:24px; } }
  .coinb.up b { animation:pop2 .35s; } .coinb.down b { color:#ff9a8a; }
  .toast { position:fixed; z-index:7; bottom:128px; left:50%; transform:translateX(-50%); background:rgba(46,36,26,.92); color:#fbf1dc; padding:7px 14px; border-radius:12px; font-size:13px; white-space:nowrap; }
  .toast[hidden] { display:none; }
  .panel { position:fixed; z-index:6; right:12px; top:84px; bottom:124px; width:360px; overflow:auto; background:var(--card); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px; box-shadow:0 6px 0 rgba(20,40,60,.35); }
  .panel[hidden] { display:none; }
  .panel .x { position:sticky; top:0; align-self:flex-end; margin:-6px -6px -34px 0; z-index:1; padding:4px 10px; }
  .pill.isle { cursor:pointer; } .pill.isle:hover { background:#fff; }
  .world { position:fixed; inset:0; z-index:30; background:#3d7fa6; overflow:hidden; }
  .world[hidden] { display:none; }
  .world .wmap { position:absolute; image-rendering:pixelated; }
  .spot { position:absolute; transform:translate(-50%, -100%); display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; border:0; background:none; padding:0; box-shadow:none; }
  .spot .tag { background:rgba(251,246,236,.96); color:var(--ink); border-radius:10px; padding:2px 8px; font:400 14px var(--f-disp); white-space:nowrap; box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .spot .tag small { font:700 11px var(--f-ui); color:var(--dim); margin-left:4px; }
  .spot .pin { width:16px; height:16px; border-radius:50%; background:var(--accent); border:3px solid #fbf6ec; box-shadow:0 0 0 0 rgba(255,255,255,.7); animation:ping 2s infinite; }
  .spot.mine .pin { background:var(--gold); } .spot.mine .tag { background:var(--gold); color:#3a2a00; } .spot.here .tag { outline:2px solid #fff; }
  .spot.new .pin { background:#fff; border-color:var(--hot); }
  @keyframes ping { 0% { box-shadow:0 0 0 0 rgba(255,255,255,.7); } 70% { box-shadow:0 0 0 14px rgba(255,255,255,0); } 100% { box-shadow:0 0 0 0 rgba(255,255,255,0); } }
  .world .wtop { position:absolute; top:12px; left:12px; right:12px; display:flex; gap:8px; align-items:center; z-index:2; }
  .world .wtop .pill { font:400 20px var(--f-disp); } .world .wtop .grow { flex:1; }
  .world .wcard { position:absolute; z-index:2; right:12px; bottom:12px; width:320px; max-width:calc(100vw - 24px); background:var(--card); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px; box-shadow:0 6px 0 rgba(0,0,0,.3); }
  .world .wcard[hidden] { display:none; } .world .wcard h2 { margin:0; font:400 21px var(--f-disp); }
  .world .wcard canvas { width:100%; border-radius:10px; background:var(--sea); image-rendering:auto; }
  /* the general pressed-button nudge must not replace the spot's own centring, or the spot slips out from under the pointer */
  .spot:active:not(:disabled) { transform:translate(-50%, calc(-100% + 2px)); box-shadow:none; } .bubble:active:not(:disabled) { transform:translate(-50%, calc(-50% + 2px)); }
  .bubble { position:absolute; transform:translate(-50%, -50%); border-radius:50%; border:3px solid #fbf6ec; background:var(--accent); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0; box-shadow:0 3px 0 rgba(0,0,0,.3), 0 0 0 6px rgba(63,122,116,.25); cursor:pointer; }
  .bubble b { font:400 16px var(--f-disp); line-height:1; } .bubble .where { position:absolute; top:100%; margin-top:4px; background:rgba(251,246,236,.95); color:var(--ink); border-radius:8px; padding:0 6px; font:700 11px var(--f-ui); white-space:nowrap; }
  .bubble.mine { background:var(--gold); color:#3a2a00; box-shadow:0 3px 0 rgba(0,0,0,.3), 0 0 0 6px rgba(227,167,47,.35); } .bubble.here { border-color:#fff; }
  .spot.dot .tag { display:none; } .spot.dot:hover .tag { display:block; } .spot.dot .pin { width:12px; height:12px; animation:none; }
  .wzoom { position:absolute; z-index:2; right:12px; top:70px; display:flex; flex-direction:column; gap:6px; } .wzoom button { width:40px; height:40px; padding:0; font:700 20px var(--f-ui); background:#fbf6ec; color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.3); }
  .wlist { display:flex; flex-direction:column; gap:4px; max-height:40vh; overflow:auto; } .wrow { display:flex; justify-content:space-between; gap:8px; background:#fbf6ec; color:var(--ink); box-shadow:none; font-weight:400; padding:7px 10px; } .wrow small { color:var(--dim); } .wrow.mine { background:#f6e2b0; }
  .world { touch-action:none; }
  .cards { position:fixed; inset:0; z-index:25; background:rgba(20,30,40,.55); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  .cards[hidden] { display:none; } .cards h2 { margin:0; color:#fff; font:400 26px var(--f-disp); text-shadow:0 2px 0 rgba(0,0,0,.4); }
  .cards .row3 { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .rcard { width:200px; min-height:230px; background:#fbf6ec; color:var(--ink); border-radius:18px; padding:16px 14px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; box-shadow:0 6px 0 rgba(0,0,0,.3); font-weight:400; animation:deal .35s cubic-bezier(.2,1.4,.4,1) backwards; }
  .rcard:hover { transform:translateY(-6px) rotate(-1deg); } .rcard .big { font-size:46px; line-height:1.1; } .rcard b { font:400 19px var(--f-disp); } .rcard small { color:var(--dim); font-size:12px; }
  .rcard .need { font-size:12px; color:var(--hot); font-weight:700; } .rcard .prize { margin-top:auto; background:var(--gold); color:#3a2a00; border-radius:999px; padding:3px 10px; font:700 12px var(--f-ui); }
  .rcard.free { background:#eef3f2; } .rcard.free .prize { background:#d4e4e1; color:var(--accent); }
  @keyframes deal { from { opacity:0; transform:translateY(40px) rotate(6deg) scale(.8); } }

  .gauge { display:inline-block; width:70px; height:8px; background:#e2d6bd; border-radius:999px; overflow:hidden; vertical-align:middle; margin-left:4px; } .gauge i { display:block; height:100%; background:var(--accent); border-radius:999px; }
  .lv { font:700 12px var(--f-ui); color:#fff; background:var(--accent); border-radius:999px; padding:1px 8px; margin-right:6px; }
  .guide { position:fixed; z-index:45; left:14px; bottom:128px; display:flex; align-items:flex-end; gap:8px; max-width:min(440px, calc(100vw - 28px)); animation:pop .4s cubic-bezier(.2,1.6,.4,1); pointer-events:none; }
  .guide[hidden] { display:none; } .inside:not([hidden]) ~ .guide { left:auto; right:14px; bottom:16px; flex-direction:row-reverse; } .inside:not([hidden]) ~ .guide .gbub::before { left:auto; right:-8px; border-right-color:transparent; border-left:8px solid #fff; } .gbird { font-size:52px; line-height:1; animation:bob 1.2s ease-in-out infinite; filter:drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
  @keyframes bob { 50% { transform:translateY(-6px) rotate(-4deg); } }

  .gbub::before { content:''; position:absolute; left:-8px; bottom:14px; border:8px solid transparent; border-right-color:#fff; border-left:0; }
  .gname { font:400 13px var(--f-disp); color:var(--accent); } .grow2 { display:flex; gap:6px; margin-top:6px; } .grow2 button { padding:6px 14px; } .grow2 .skip { background:none; box-shadow:none; color:var(--dim); font-weight:400; padding:6px 4px; }
  .garrow { position:fixed; z-index:46; color:var(--gold); font-size:34px; text-shadow:0 3px 0 #9a6f14, 0 0 8px #fff; transform:translate(-50%, -100%); pointer-events:none; animation:point .7s ease-in-out infinite; }
  .garrow[hidden] { display:none; } @keyframes point { 50% { margin-top:-10px; } }
  .glow { box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--gold), 0 0 24px 8px rgba(227,167,47,.8) !important; border-radius:12px; }
  @media (max-width:760px) { .panel { left:8px; right:8px; top:auto; width:auto; max-height:52vh; } }
  .panel h2 { margin:0; font:400 21px var(--f-disp); } .panel h3 { margin:4px 0 0; font:400 16px var(--f-disp); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
