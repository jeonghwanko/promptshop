    for (const d of snap.docs) docs.set(d.id, d.data() ?? {});
    if (me && docs.has(me)) { const remote = docs.get(me); myDoc = { slot: remote.slot, at: remote.at, plots: remote.plots ?? {}, half: remote.half ?? {}, wallet: { coins: Math.max(myDoc?.wallet.coins ?? 0, remote.wallet?.coins ?? 0), unlocked: remote.wallet?.unlocked ?? ['S'] } }; docs.set(me, myDoc); }
    else if (me && myDoc) docs.set(me, myDoc);
    rebuild(); resolveNames();
  }, () => show(el('p', { class: 'err' }, '군도를 불러오지 못했어요.')));
} else { docs = new Map(Object.entries(ISLES_SEED)); rebuild(); }
showHome();
// ?open=<plot key> opens a building's inside at once (for checks)
{ const k = new URLSearchParams(location.search).get('open'); if (k) setTimeout(() => { showBuilding(k); openInside(k); }, 300); }
</script>
